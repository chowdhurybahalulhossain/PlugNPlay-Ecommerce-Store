<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — PlugNPlay</title>
<script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header class="nav">
        <a href="index.html" class="logo"><span class="logo-mark"></span>PlugNPlay</a>
        <nav class="nav-links">
            <a href="index.html">Shop</a>
            <a href="orders.html">Orders</a>
            <a href="cart.html" class="cart-link">Cart <span class="badge" id="cartCount" hidden>0</span></a>
            <a href="login.html" id="authLink">Sign in</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </nav>
    </header>

    <main class="auth-split">
        <section class="auth-visual spot" data-spotlight>
            <div class="layer dots" aria-hidden="true"></div>
            <div class="layer word ghost" aria-hidden="true">HELLO</div>
            <div class="layer word lit" aria-hidden="true">HELLO</div>
            <div class="auth-copy">
                <h2>Welcome back.</h2>
                <p>Track orders, keep your cart, and check out faster.</p>
            </div>
        </section>

        <section class="auth-form-side">
            <div class="auth-box">
                <h1 id="authTitle">Sign in</h1>
                <div id="authMessage" class="auth-message" role="alert"></div>

                <form id="loginForm" class="auth-form">
                    <label>Email
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </label>
                    <label>Password
                        <input type="password" id="loginPassword" placeholder="Your password" required>
                    </label>
                    <button type="submit" class="btn">Sign in</button>
                </form>

                <form id="signupForm" class="auth-form hidden">
                    <label>Full name
                        <input type="text" id="signupName" placeholder="Your name" required>
                    </label>
                    <label>Email
                        <input type="email" id="signupEmail" placeholder="you@example.com" required>
                    </label>
                    <label>Password
                        <input type="password" id="signupPassword" placeholder="At least 6 characters" minlength="6" required>
                    </label>
                    <button type="submit" class="btn">Create account</button>
                </form>

                <p class="switch">
                    <span id="switchText">New here?</span>
                    <button type="button" class="link" id="switchBtn">Create an account</button>
                </p>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>

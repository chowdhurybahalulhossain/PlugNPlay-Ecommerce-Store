<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart — PlugNPlay</title>
<meta name="description" content="Review your selected gear before checkout. Keyboards, mice, audio, and more.">
<script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <header class="nav">
        <a href="index.html" class="logo"><span class="logo-mark"></span>PlugNPlay</a>
        <nav class="nav-links" style="margin-left:auto;">
            <a href="index.html">Shop</a>
            <a href="orders.html">Orders</a>
            <a href="cart.html" class="cart-link">Cart <span class="badge" id="cartCount" hidden>0</span></a>
            <a href="login.html" id="authLink">Sign in</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </nav>
    </header>

    <main class="cart-page">
        <div class="cart-page-header">
            <h1>Your Cart</h1>
            <span class="cart-item-count" id="cartItemCount" hidden></span>
        </div>

        <div class="cart-layout">
            <div class="cart-list" id="cartList"></div>

            <aside class="cart-summary">
                <h2>Order Summary</h2>
                <div class="row"><span>Subtotal</span><span id="subtotal">৳0</span></div>
                <div class="row muted"><span>Shipping</span><span>Calculated at checkout</span></div>
                <div class="cart-free-ship">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
                    </svg>
                    Free delivery on all orders
                </div>
                <div class="row total"><span>Total</span><span id="totalAmount">৳0</span></div>
                <a href="checkout.html" class="btn" id="checkoutBtn">
                    Proceed to Checkout
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
            </aside>
        </div>
    </main>

    <footer class="footer">
        <span>PlugNPlay</span>
        <span>Built with Node.js, Express, PostgreSQL and Stripe</span>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>

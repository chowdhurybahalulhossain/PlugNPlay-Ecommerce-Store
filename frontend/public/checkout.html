<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — PlugNPlay</title>
<script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="stylesheet" href="css/checkout.css">
</head>
<body>
    <header class="nav">
        <a href="index.html" class="logo"><span class="logo-mark"></span>PlugNPlay</a>
        <nav class="nav-links" style="margin-left:auto;">
            <a href="index.html">Shop</a>
            <a href="orders.html">Orders</a>
            <a href="cart.html" class="cart-link">Cart <span class="badge" id="cartCount" hidden>0</span></a>
            <a href="login.html" id="authLink">Sign in</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </nav>
    </header>

    <main class="checkout-page">
        <h1>Checkout</h1>
        <div class="cart-layout">
            <form class="checkout-form" id="checkoutForm">
                <h2>Shipping address</h2>
                <label>Full address
                    <textarea id="shippingAddress" rows="3" placeholder="House, road, area, city" required></textarea>
                </label>

                <h2>Payment</h2>
                <div class="pay-card">
                    <div class="pay-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>
                        <div>
                            <p class="pay-title">Test Visa card</p>
                            <p class="pay-sub">4242 4242 4242 4242 — Stripe test mode, no real charge</p>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn" id="payBtn">Place order</button>
                <p id="checkoutMessage" class="auth-message"></p>
            </form>

            <aside class="cart-summary" id="orderSummary">
                <h2>Order summary</h2>
                <div id="summaryItems"></div>
                <div class="row total"><span>Total</span><span id="summaryTotal">৳0</span></div>
            </aside>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
